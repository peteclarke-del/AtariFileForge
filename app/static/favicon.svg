<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Atari File Forge</title>
  <defs>
    <pattern id="mover" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#101010"/>
      <rect x="1" y="1" width="1" height="1" fill="#101010"/>
    </pattern>
    <clipPath id="fuji">
      <path d="M42.2 29.5h3.6v21h-3.6z"/>
      <path d="M38.4 31.5h3.1c0 9-2.8 14-4.8 19h-3.5c2-5 5.2-10 5.2-19z"/>
      <path d="M49.6 31.5h-3.1c0 9 2.8 14 4.8 19h3.5c-2-5-5.2-10-5.2-19z"/>
    </clipPath>
  </defs>
  <!-- GEM window frame on the ST chassis: black furniture, white title bar and body -->
  <rect x="3" y="7" width="58" height="50" rx="4" fill="#101010"/>
  <rect x="4.5" y="8.5" width="55" height="7" fill="#ffffff"/>
  <rect x="12" y="9.5" width="40" height="5" fill="url(#mover)"/>
  <rect x="5.5" y="9" width="5.5" height="6" fill="#ffffff" stroke="#101010" stroke-width="1"/>
  <rect x="7.25" y="10.75" width="2" height="2.5" fill="#101010"/>
  <rect x="53" y="9" width="5.5" height="6" fill="#ffffff" stroke="#101010" stroke-width="1"/>
  <path d="M55.75 10.5 57.5 12 55.75 13.5 54 12Z" fill="#101010"/>
  <rect x="4.5" y="17" width="55" height="38.5" rx="1" fill="#ffffff"/>

  <!-- 3.5 inch floppy -->
  <rect x="9" y="22" width="26" height="29" rx="2" fill="#2b2b2b" stroke="#101010" stroke-width="1.5"/>
  <rect x="14" y="22" width="16" height="12" rx="1" fill="#d8d4c8"/>
  <rect x="19" y="22" width="9" height="12" fill="#8a8a8a"/>
  <rect x="13" y="38" width="18" height="12" rx="1" fill="#f3f1ea"/>
  <rect x="15" y="41" width="14" height="1.6" fill="#6d6d6d"/>
  <rect x="15" y="44" width="10" height="1.6" fill="#6d6d6d"/>
  <rect x="15" y="47" width="12" height="1.6" fill="#6d6d6d"/>

  <!-- Fuji emblem: three strokes filled with the Atari rainbow bands -->
  <circle cx="44" cy="40" r="15" fill="#ffffff" stroke="#101010" stroke-width="1.5"/>
  <g clip-path="url(#fuji)">
    <rect x="32" y="29" width="24" height="3.75" fill="#e4002b"/>
    <rect x="32" y="32.75" width="24" height="3.75" fill="#ff6a13"/>
    <rect x="32" y="36.5" width="24" height="3.75" fill="#ffc400"/>
    <rect x="32" y="40.25" width="24" height="3.75" fill="#1aa12d"/>
    <rect x="32" y="44" width="24" height="3.75" fill="#0d5fd6"/>
    <rect x="32" y="47.75" width="24" height="3.75" fill="#7a2c99"/>
  </g>
  <g fill="none" stroke="#101010" stroke-width=".8" stroke-linejoin="round">
    <path d="M42.2 29.5h3.6v21h-3.6z"/>
    <path d="M38.4 31.5h3.1c0 9-2.8 14-4.8 19h-3.5c2-5 5.2-10 5.2-19z"/>
    <path d="M49.6 31.5h-3.1c0 9 2.8 14 4.8 19h3.5c-2-5-5.2-10-5.2-19z"/>
  </g>
</svg>
