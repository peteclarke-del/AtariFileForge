services:
  atari-file-forge:
    build: .
    image: atari-file-forge:latest
    container_name: atari-file-forge
    # The container still listens on 8666 for the application and 8668 for the
    # emulator display. Only the host side moves, because those two ports are
    # commonly already taken: the sibling File Forge applications publish 8666,
    # 8668, 8674 and 8675, and they are all meant to run side by side. Override
    # with ATARI_FILE_FORGE_PORT and ATARI_FILE_FORGE_VNC_PORT.
    ports:
      - "${ATARI_FILE_FORGE_PORT:-8684}:8666"
      - "${ATARI_FILE_FORGE_VNC_PORT:-8685}:8668"
    environment:
      ATARI_FILE_FORGE_WORK_DIR: /app/work
      ATARI_MAX_UPLOAD_GIB: "8"
    volumes:
      - atari-file-forge-work:/app/work
    restart: unless-stopped
    command: >-
      sh -c "websockify --web=/usr/share/novnc 8668 localhost:5900 &
      exec gunicorn --bind 0.0.0.0:8666 --workers 1 --threads 8 --timeout 300
      --access-logfile - app.wsgi:app"

volumes:
  atari-file-forge-work:
    name: atari-file-forge-work

networks:
  default:
    name: atari-file-forge-network
